; Indoor — display MQTT (ESP32 TTGO LoRa32)
; Compilar desde esta carpeta: pio run
;
; Board (cualquier ESP32; SIEMPRE sin OLED — UI = LCD ST7789 + MAX hora):
;   ttgo-lora32-v1     ← default: LoRa RST=14 (WROOM)
;   ttgo-lora32-v21new ← V2.1.6: LoRa RST=23, SD en 13/15/2/14
;   esp32dev           ← genérico (mismos GPIOs si cableás igual)
; Ref: https://www.espboards.dev/esp32/ttgo-lora32/
; Si tu PCB es V2.x, cambiá `board =` en TODOS los envs de este ini.
; OLED removido (no hay código ni lib SSD1306). LoRa RST=14 LOW. MAX DIN=21 CLK=18 CS=5.
; Diagnóstico boot: pio run -e indoor_minimal
; Diagnóstico solo LCD: pio run -e indoor_lcd_test
; Diagnóstico solo MAX7219: pio run -e indoor_max_test

[platformio]
default_envs = ttgo

[env:ttgo]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
	-D MQTT_MAX_PACKET_SIZE=512
	-D ARDUINO_LOOP_STACK_SIZE=8192

; lcd/max test mains tienen setup/loop propios — excluir del firmware full.
build_src_filter = +<*> -<lcd_test_main.cpp> -<max_test_main.cpp>

lib_deps =
	arkhipenko/TaskScheduler@^3.8.5
	tzapu/WiFiManager@^2.0.17
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.5
	arduino-libraries/NTPClient@^3.2.1
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
	; LedControl: lib/LedControl (misma API wayoda, con #include pgmspace ESP32)

; Solo Serial + pines idle (sin displays / WiFi / MQTT)
[env:indoor_minimal]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DINDOOR_MINIMAL
build_src_filter = +<main.cpp>

; Solo LCD diagnóstico (sin WiFi / MQTT / MAX7219 / TaskScheduler)
; Adafruit ST7789 HW SPI CS=-1 MODE3 — mismo cableado que firmware full.
[env:indoor_lcd_test]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DINDOOR_LCD_TEST
build_src_filter = +<lcd_test_main.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

; Solo MAX7219 diagnóstico (sin WiFi / MQTT / LCD / TaskScheduler)
; LedControl(DIN, CLK, CS) DIN=21 CLK=18 CS=5 — pines validados en este TTGO.
[env:indoor_max_test]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DINDOOR_MAX_TEST
build_src_filter = +<max_test_main.cpp> +<display/Max7219Display.cpp>
; LedControl vía lib/LedControl (parche ESP32; no wayoda registry)
