; Indoor — display MQTT (ESP8266 NodeMCU / ideaspark OLED)
; Compilar desde esta carpeta: pio run
; Diagnóstico boot: pio run -e indoor_minimal

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.f_cpu = 80000000L
; Clones chinos / ideaspark: DOUT suele evitar boot loop (ets Jan 8...)
board_build.flash_mode = dout
board_build.flash_size = 4MB
; Excluir stub/WIP TaskManager si aparece en el árbol
build_src_filter = +<*> -<core/TaskManager.*>

build_flags =
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
	-D MQTT_MAX_PACKET_SIZE=512

lib_deps =
	arkhipenko/TaskScheduler@^3.8.5
	tzapu/WiFiManager@^2.0.17
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.5
	arduino-libraries/NTPClient@^3.2.1
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
	adafruit/Adafruit SSD1306@^2.5.9

; Solo Serial + pines boot-safe (sin displays / WiFi / MQTT)
[env:indoor_minimal]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.f_cpu = 80000000L
board_build.flash_mode = dout
board_build.flash_size = 4MB
build_flags = -DINDOOR_MINIMAL
build_src_filter = +<main.cpp>
